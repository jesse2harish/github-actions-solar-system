name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}      
    #MONGO_USERNAME: superuser
    #MONGO_PASSWORD: SuperPassword
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
        
        - name: Debug env presence
          run: |
            echo "MONGO_URI set? ${{ env.MONGO_URI != '' }}"
            echo "MONGO_USERNAME var set? ${{ vars.MONGO_USERNAME != '' }}"
            echo "MONGO_PASSWORD secret set? ${{ secrets.MONGO_PASSWORD != '' }}"  


        - name: Print test-results.xml (first 100 lines)
          if: always()
          run: |
            echo "PWD=$(pwd)"
            if [ -f test-results.xml ]; then
               echo "Found test-results.xml in current directory"
               sed -n '1,100p' test-results.xml
            else
              echo "test-results.xml not in current directory, searching workspace..."
              FILE=$(find "$GITHUB_WORKSPACE" -type f -name "test-results.xml" | head -n 1)
              if [ -n "$FILE" ]; then
                 echo "Found at: $FILE"
                 sed -n '1,100p' "$FILE"
              else
                echo "test-results.xml not found anywhere under $GITHUB_WORKSPACE"
              fi
            fi  
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v3
          with:
            node-version: 18

        #- name: Composite Action - Cache & Install NPM Packages
        #  uses: ./.github/custom-actions/npm-action
        #  with:
        #    path-of-folder: node_modules
        
        - name: Install Dependencies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5          
